[project]
name = "ai-account-manager"
version = "0.1.0"
description = "Provider-agnostic AI account, quota and profile manager"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/sewes-ds/ai-session-control-center"
Repository = "https://github.com/sewes-ds/ai-session-control-center.git"
Issues = "https://github.com/sewes-ds/ai-session-control-center/issues"

[project.scripts]
cus-codex-managed-profile-update = "ai_account_manager.providers.codex.managed_profile_update:main"
cus-runtime-agent-instance = "ai_account_manager.runtime_agent_instance:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx2>=2.4.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
